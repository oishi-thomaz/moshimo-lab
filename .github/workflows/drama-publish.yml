name: drama-publish

# いつわ劇場：仕上がった1話（drama-out ブランチの mp4・表紙・説明）を投稿サーバーに送って、LINE に承認待ちを出す
on:
  workflow_dispatch:
    inputs:
      id:
        description: '投稿サーバーでの番号。カンマ区切りで複数（この順に承認カードが届く。例 1001,1002）'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: ${{ secrets.ITSUWA_BASE_URL }}
      SECRET: ${{ secrets.ITSUWA_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drama-out
          sparse-checkout: posts
      - name: Upload to VPS and ask for approval
        run: |
          [ -n "$BASE" ] && [ -n "$SECRET" ] || { echo "ITSUWA_BASE_URL / ITSUWA_SECRET が未設定"; exit 1; }
          for ID in $(echo "${{ github.event.inputs.id }}" | tr ',' ' '); do
            for f in "$ID.mp4" "$ID.json" "${ID}_cover.jpg"; do
              curl -fsS --retry 3 -T "posts/$ID/$f" -H "X-Moshimo-Secret: $SECRET" "$BASE/upload/$f"; echo
            done
            curl -fsS -X POST "$BASE/hook/new" -H "X-Moshimo-Secret: $SECRET" -H 'content-type: application/json' -d "{\"id\":\"$ID\"}"; echo
            sleep 3
          done

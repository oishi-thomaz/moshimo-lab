name: vps

# VPS（もしもラボの投稿サーバー）とのやりとり。毎朝の解析タスク（Claude）が tools/run.mjs から手動実行する
#  collect : VPS に貯まっている毎時の数字を取ってきて data/ に保存して commit
#  report  : 日報（file の JSON {message, at}）を VPS に預ける。at の時刻に LINE へ届く
#  control : 投稿時間の変更など（file の JSON {postTimes, notice}）
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'collect / report / control / media'
        required: true
        default: collect
      file:
        description: 'report / control で送る JSON ファイル（このリポジトリ内のパス）'
        required: false

permissions:
  contents: write

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Talk to VPS
        env:
          MOSHIMO_AN: ${{ secrets.MOSHIMO_AN }}
        run: node tools/vps.mjs "${{ inputs.action }}" "${{ inputs.file }}"
      # TikTok は公式APIに法人の審査が要るので、公開の埋め込み用ページから読む（VPS の取得の予備。失敗しても他は続ける）
      - name: TikTok (public embed)
        if: inputs.action == 'collect'
        continue-on-error: true
        timeout-minutes: 3
        run: node tools/tiktok.mjs moshimo__lab
      - name: Save data
        if: inputs.action == 'collect'
        run: |
          git config user.name "moshimo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -qm "data $(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      # media：VPS の動画を一時ブランチ media-tmp に置く（TikTok への予約投稿の準備用。使ったらブランチは消す）
      - name: Fetch media
        if: inputs.action == 'media'
        env:
          MOSHIMO_AN: ${{ secrets.MOSHIMO_AN }}
        run: |
          BASE=$(echo "$MOSHIMO_AN" | awk '{print $1}')
          git config user.name "moshimo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan media-tmp && git rm -rfq . && mkdir -p media
          for id in $(echo "${{ inputs.file }}" | tr ',' ' '); do curl -fsS -o "media/$id.mp4" "$BASE/media/$id.mp4"; ls -la "media/$id.mp4"; done
          git add media && git commit -qm "media ${{ inputs.file }}" && git push -qf origin media-tmp
